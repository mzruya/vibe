[package]
name = "vibe"
version = "0.1.0"
edition = "2024"
description = "AI-powered package manager - Homebrew meets AI coding agents"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
indicatif = "0.18"
console = "0.16"
anyhow = "1"
thiserror = "2"
dirs = "6"
which = "8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
mockito = "1"
